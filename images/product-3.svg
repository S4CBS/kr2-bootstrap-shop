<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <rect width="400" height="260" rx="12" fill="#0f172a" />
  <defs>
    <linearGradient id="tklAura" x1="0%" y1="0%" x2="100%" y2="100%">
