    <rect x="65" y="10" width="48" height="40" rx="6" fill="#f87171" stroke="#dc2626" stroke-width="1.5" />
    <rect x="79" y="0" width="20" height="22" rx="4" fill="#ef4444" />
    <path d="M89 4V16M83 10H95" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Switch 3 -->
