<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rgbBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background aura -->
  <ellipse cx="360" cy="210" rx="320" ry="170" fill="url(#bgGlow)" />

  <!-- Keyboard Body Outer Case -->
  <g filter="url(#softShadow)">
    <rect x="70" y="70" width="580" height="280" rx="24" fill="url(#caseGrad)" stroke="#475569" stroke-width="2" />
    <!-- Underglow light strip -->
    <rect x="78" y="78" width="564" height="6" rx="3" fill="url(#rgbBar)" opacity="0.85" />
    <!-- Inner Plate -->
    <rect x="90" y="94" width="540" height="236" rx="14" fill="#0f172a" />
  </g>

  <!-- Knob in top right -->
  <circle cx="600" cy="120" r="14" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
  <circle cx="600" cy="120" r="9" fill="#334155" />
  <line x1="600" y1="113" x2="600" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Row 1: Function Keys -->
